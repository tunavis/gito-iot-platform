# Mosquitto MQTT Broker Configuration
# Development setup - Phase 1

# Listener for plain MQTT (non-TLS)
listener 1883 0.0.0.0
protocol mqtt

# Allow all connections (development only - restrict in production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
# stdout ONLY. Mosquitto cannot rotate its own log file, and `log_dest file`
# with log_type all grew to 700 MB unrotated — it would eventually fill the
# volume. Docker's json-file driver rotates for us (see docker-compose.yml's
# logging: block), which also fixes `docker logs gito-mosquitto` having gone
# silent. log_type stays `all`: the per-message "Sending PUBLISH to <client>"
# lines are the only way to prove an uplink actually reached a subscriber.
log_dest stdout
log_type all
log_timestamp true

# Security - will be configured with PostgreSQL auth in Phase 2
# For now, allow anonymous to test
