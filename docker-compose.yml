services:
  # TimescaleDB (PostgreSQL 16 + time-series extensions)
  postgres:
    # PINNED, never floating. `latest-pg16` silently moves; binary/extension
    # drift against the on-disk data makes compressed telemetry chunks read back
    # EMPTY, which looks exactly like data loss. It also has to match staging
    # exactly or mirror_to_staging.sh's dump won't restore (it hard-aborts on a
    # version mismatch). Bump this and docker-compose.staging.yml together.
    image: timescale/timescaledb:2.25.2-pg16
    container_name: gito-postgres
    environment:
      POSTGRES_DB: gito
      POSTGRES_USER: gito
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # host 5433 → container 5432 (5432 free for WSL/other stacks)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gito -d gito"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gito-network
    restart: unless-stopped

  # KeyDB (In-memory cache + pub/sub for rate limiting, sessions)
  keydb:
    image: eqalpha/keydb:latest
    container_name: gito-keydb
    ports:
      - "6379:6379"
    volumes:
      - keydb_data:/data
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gito-network
    restart: unless-stopped

  # Mosquitto MQTT Broker (Device communication)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: gito-mosquitto
    ports:
      - "1883:1883"    # Non-TLS (dev)
      - "8883:8883"    # TLS (production)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    # log_type all is verbose by design (it's the only broker forensics we have)
    # so the log MUST be bounded — 150 MB of history, rotated, then dropped.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gito-network
    restart: unless-stopped

  # MQTT Processor (Consumes MQTT, processes telemetry, fires alerts)
  processor:
    build:
      # repo-root context so the image can install shared/alarm_core
      context: .
      dockerfile: ./processor/Dockerfile
    container_name: gito-processor
    environment:
      DATABASE_URL: postgresql://gito:${DB_PASSWORD:-dev-password}@postgres:5432/gito
      REDIS_URL: redis://keydb:6379
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-admin}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-admin-password}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    volumes:  # Development mode - live code sync
      - ./processor:/app
    depends_on:
      postgres:
        condition: service_healthy
      keydb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - gito-network
    restart: unless-stopped

  # FastAPI Backend (REST API + WebSocket) - DEVELOPMENT MODE
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        INSTALL_DEV: "true"   # so `docker exec gito-api pytest` works here
    container_name: gito-api
    environment:
      DATABASE_URL: postgresql+asyncpg://gito:${DB_PASSWORD:-dev-password}@postgres:5432/gito
      REDIS_URL: redis://keydb:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-min-32-chars-xxxxx}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      JWT_ALGORITHM: HS256
      # Dev: hot reload instead of the 4 workers entrypoint.sh defaults to.
      # Passing it here rather than as a `command:` keeps the migration step —
      # see the note where `command:` used to be.
      UVICORN_ARGS: "--reload"
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-admin}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-admin-password}
      # INFO by default: DEBUG turns on SQLAlchemy echo (see database.py), which
      # buries every real event under thousands of SELECTs. LOG_LEVEL=DEBUG in
      # .env when you actually want to read the SQL.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: development
      # Card gateway (values come from gitignored .env; disabled if unset)
      CARD_PROVIDER: ${CARD_PROVIDER:-paystack}
      PAYSTACK_ENABLED: ${PAYSTACK_ENABLED:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      # MCP server. Off unless MCP_ENABLED=true is set in .env — same default as
      # everywhere else. Without these three lines .env could not reach the
      # container at all, so `MCP_ENABLED=true` there looked like it worked and
      # silently did nothing.
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_PROTOCOL_VERSION: ${MCP_PROTOCOL_VERSION:-2026-07-28}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1,localhost,127.0.0.1:*,localhost:*,api:*,gito-api:*}
    ports:
      - "8001:8000"  # host 8001 → container 8000 (8000 free for WSL/other stacks)
    depends_on:
      postgres:
        condition: service_healthy
      keydb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:  # Hot reload - live code sync
      - ./api:/app
      # test_device_driver.py reads the shipped drivers off disk at
      # `parents[2]/drivers` — the repo root on a host checkout, but `/` inside
      # this container, since only ./api is mounted. Without this the file fails
      # collection and takes the whole suite down with it, which matters because
      # `docker exec gito-api pytest` is how the API tests are run.
      - ./drivers:/drivers:ro
    # NO `command:` here, deliberately. A compose `command:` REPLACES the image
    # CMD — which is `entrypoint.sh`, the script that runs `alembic upgrade head`
    # before starting uvicorn. This service used to override it with a bare
    # uvicorn line to get `--reload`, and so the dev stack never migrated: it
    # came up against whatever schema the volume already had. Pull a branch with
    # a new migration, restart, and the API silently serves the old schema —
    # which reads as an application bug for as long as it takes to suspect the
    # database, and is the first thing a second developer pulling `main` hits.
    # `--reload` now comes from UVICORN_ARGS above, so the retry-on-first-boot
    # migration logic has exactly one home.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - gito-network
    restart: unless-stopped

  # Next.js Frontend (Gateway + UI) - DEVELOPMENT MODE
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev  # Use dev Dockerfile for hot reload
    container_name: gito-web
    environment:
      FASTAPI_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /api  # Routes through nginx
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-min-32-chars-xxxxx}
      NODE_ENV: development
    ports:
      - "3001:3000"  # host 3001 → container 3000 (3000 free for WSL/other stacks)
    depends_on:
      api:
        condition: service_healthy
    volumes:  # Hot reload - live code sync
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev  # Development server with hot reload
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - gito-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: gito-nginx
    ports:
      # Host 80 collides with an nginx running inside the Ubuntu WSL distro
      # (WSL2 shares localhost with Windows), so the app is published on 8088
      # instead — open http://localhost:8088. See ADR/notes on WSL port-80 collision.
      - "8088:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - gito-network
    restart: unless-stopped

volumes:
  postgres_data:
  keydb_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  gito-network:
    driver: bridge
