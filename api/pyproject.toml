[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gito-api"
version = "0.1.0"
description = "Gito IoT Platform - FastAPI Backend"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gito", email = "dev@gito-iot.com"},
]
readme = "README.md"
keywords = ["iot", "fastapi", "multi-tenant", "timescaledb"]

dependencies = [
    # fastapi/pydantic/uvicorn/python-multipart were lifted together in one step
    # because the MCP SDK cannot be installed under the old pins: it needs
    # anyio>=4.5 and a modern starlette, and fastapi 0.104.1 caps anyio<4.0.0 and
    # starlette<0.28.0. These versions are the set pip resolves when mcp==2.0.0 is
    # part of the requirement set, so the follow-up MCP change is a one-line add.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    "sqlalchemy[asyncio]==2.0.23",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.3.2",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt==2.11.0",
    "passlib[bcrypt]==1.7.4",
    # Declared directly, not inherited from python-jose's [cryptography]
    # extra. `app/services/secrets.py` imports Fernet itself, and a
    # load-bearing dependency held only through someone else's extra
    # disappears the day that package restructures.
    "cryptography>=42,<51",
    "python-multipart==0.0.32",
    "python-dotenv==1.0.0",
    "redis==5.0.1",
    "tenacity==8.2.3",
    "paho-mqtt==1.6.1",
    "httpx==0.25.2",
    "aiohttp==3.9.1",
    "pydantic-extra-types==2.2.0",
    "python-jose[cryptography]==3.3.0",
    "email-validator==2.1.0",
    "apscheduler==3.10.4",
    "jinja2>=3.1.0",
    "slowapi>=0.1.9",
    # Exact pin, not a range: this is a protocol boundary. A silent minor bump
    # could change negotiated behaviour against clients we do not control.
    # See MCP_PROTOCOL_VERSION in config.py, asserted at startup.
    "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "sqlalchemy[mypy]==2.0.23",
    "httpx==0.25.2",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "C", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]
